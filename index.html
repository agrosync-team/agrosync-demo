<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agro-Sync · แผนที่ล็อตสำหรับคนรถ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: sans-serif; color: #1d2b1f; background: #f6f8f3; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px; background: #2f6b3a; color: #fff; }
  header h1 { font-size: 18px; margin: 0; }
  .tag { font-size: 13px; padding: 2px 8px; border-radius: 99px; background: rgba(255,255,255,.18); }
  main { display: grid; grid-template-columns: 1fr 360px; height: calc(100vh - 48px); }
  #map { height: 100%; }
  aside { overflow-y: auto; padding: 12px; border-left: 1px solid #d6ddd2; }
  .lot { background: #fff; border: 1px solid #d6ddd2; border-left: 6px solid var(--c); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .lot h3 { margin: 0 0 4px; font-size: 16px; }
  .lot p { margin: 2px 0; font-size: 14px; }
  .lot select, .lot input, .lot button { font-size: 14px; padding: 6px; margin-top: 6px; width: 100%; }
  .lot button { background: #2f6b3a; color: #fff; border: 0; border-radius: 6px; padding: 8px; cursor: pointer; }
  .legend { font-size: 13px; margin-bottom: 10px; line-height: 1.7; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c); margin-right: 4px; }
  #toast { font-size: 14px; margin-bottom: 8px; min-height: 18px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; } aside { border-left: 0; } }
</style>
</head>
<body>
<header>
  <h1>Agro-Sync · ล็อตที่พร้อมเก็บ</h1>
  <span class="tag" id="today">กำลังโหลด…</span>
  <span class="tag">ข้อมูลจำลอง ต.ผาเสวย</span>
</header>
<main>
  <div id="map"></div>
  <aside>
    <div id="toast"></div>
    <div class="legend" id="legend"></div>
    <div id="lots"></div>
  </aside>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyNBUmmQALCjzvPbGgeXDAdOXFd92u8CkqGoGoaghTCjmvocf0mU6cHVzxjzjXnWGys/exec';
const CROP = { rice: 'ฟางข้าว', sugarcane: 'ใบอ้อย', cassava: 'เหง้ามัน' };
const STATUS = {
  planned:   { th: 'ครบขั้นต่ำ รอรถ',   c: '#2e9d4a' },
  pending:   { th: 'ยังไม่ถึงขั้นต่ำ', c: '#e39b1b' },
  scheduled: { th: 'นัดรถแล้ว',       c: '#2f6fd6' },
  collected: { th: 'เก็บแล้ว',         c: '#8a948a' },
  none:      { th: 'ยังไม่รวมล็อต',    c: '#ffffff' }
};
const $ = id => document.getElementById(id);

const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18, attribution: 'Imagery © Esri' });
const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
const map = L.map('map', { layers: [sat] }).setView([16.755, 103.965], 12);
L.control.layers({ 'ภาพดาวเทียม': sat, 'แผนที่ถนน': osm }).addTo(map);
const layer = L.layerGroup().addTo(map);

$('legend').innerHTML = Object.values(STATUS).map(s => `<span class="dot" style="--c:${s.c};border:1px solid #555"></span>${s.th}`).join(' &nbsp; ');

const km = (a, b) => { const r = Math.PI / 180, x = (b.lng - a.lng) * r * Math.cos((a.lat + b.lat) / 2 * r), y = (b.lat - a.lat) * r; return Math.hypot(x, y) * 6371; };
const addDay = (s, n) => { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };

async function load(fit) {
  const data = await (await fetch(API_URL)).json();
  $('today').textContent = 'วันนี้ (เดโม): ' + data.demo_today;
  layer.clearLayers();
  const lotOf = Object.fromEntries(data.lots.map(l => [l.lot_id, l]));

  // วงล็อต: รอบจุดกึ่งกลางของแปลงในล็อต
  data.lots.forEach(l => {
    const ps = data.plots.filter(p => p.lot_id === l.lot_id);
    if (!ps.length) return;
    const c = { lat: ps.reduce((s, p) => s + +p.lat, 0) / ps.length, lng: ps.reduce((s, p) => s + +p.lng, 0) / ps.length };
    const r = Math.max(...ps.map(p => km(c, { lat: +p.lat, lng: +p.lng }))) * 1000 + 250;
    const st = STATUS[l.status] || STATUS.none;
    L.circle([c.lat, c.lng], { radius: r, color: st.c, weight: 2, fillOpacity: 0.12 })
      .bindTooltip(`${l.lot_id} · ${CROP[l.crop]} · ${Number(l.total_t).toFixed(1)} ตัน`, { permanent: true, direction: 'top' })
      .addTo(layer);
  });

  // จุดแปลง (ไม่มีชื่อหรือรหัสเกษตรกร)
  data.plots.forEach(p => {
    const st = STATUS[(lotOf[p.lot_id] || {}).status] || STATUS.none;
    L.circleMarker([+p.lat, +p.lng], { radius: 6, color: '#222', weight: 1, fillColor: st.c, fillOpacity: 1 })
      .bindPopup(`<b>${p.plot_id}</b><br>${CROP[p.crop]} ${p.area_rai} ไร่<br>ประมาณ ${Number(p.est_tonnes).toFixed(1)} ตัน<br>พร้อม ${p.ready_date}<br>${p.lot_id ? 'ล็อต ' + p.lot_id : 'ยังไม่รวมล็อต'}`)
      .addTo(layer);
  });
  if (fit) map.fitBounds(L.latLngBounds(data.plots.map(p => [+p.lat, +p.lng])).pad(0.1));

  // รายการล็อต: ล็อตที่รับงานได้ขึ้นก่อน
  const order = ['planned', 'pending', 'scheduled', 'collected'];
  $('lots').innerHTML = data.lots.slice().sort((a, b) => order.indexOf(a.status) - order.indexOf(b.status)).map(l => {
    const st = STATUS[l.status] || STATUS.none;
    const cons = data.contractors.filter(c => String(c.crops_accepted).split(',').includes(l.crop));
    const form = l.status === 'planned' ? `
      <select id="c-${l.lot_id}">${cons.map(c => `<option value="${c.contractor_id}">${c.name} (ขั้นต่ำ ${c.min_lot_t} ตัน)</option>`).join('')}</select>
      <input id="d-${l.lot_id}" type="date" value="${addDay(l.ready_to, 1)}">
      <button onclick="accept('${l.lot_id}')">รับงานล็อตนี้</button>` : '';
    return `<div class="lot" style="--c:${st.c}">
      <h3>${l.lot_id} · ${CROP[l.crop]} · ${Number(l.total_t).toFixed(1)} ตัน</h3>
      <p>${l.plot_count} แปลง · พร้อม ${l.ready_from} ถึง ${l.ready_to}</p>
      <p>สถานะ: ${st.th}${l.pickup_date ? ' · รถเข้า ' + l.pickup_date : ''}</p>${form}</div>`;
  }).join('');
}

async function accept(lotId) {
  $('toast').textContent = 'กำลังส่ง…';
  const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({
    action: 'accept_lot', lot_id: lotId, contractor_id: $('c-' + lotId).value, pickup_date: $('d-' + lotId).value }) });
  const out = await res.json();
  $('toast').textContent = out.error ? '⚠ ' + out.error : `รับงาน ${lotId} แล้ว แจ้งชาวบ้านทาง LINE ${out.notified} คน`;
  load(false);
}

load(true).catch(e => { $('today').textContent = 'โหลดข้อมูลไม่สำเร็จ: ' + e.message; });
setInterval(() => load(false).catch(() => {}), 15000);   // รีเฟรชเองทุก 15 วินาที ระหว่างถ่ายเดโม
</script>
</body>
</html>
